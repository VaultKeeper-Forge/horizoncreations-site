name: Commerce control pre-connection verification

on:
  pull_request:
    paths:
      - "server/**"
      - "infrastructure/**"
      - "assets/commerce-client.*"
      - "scripts/build-v2.mjs"
      - "site-v2/catalog.mjs"
      - ".github/workflows/commerce-control.yml"
  push:
    branches:
      - commerce/shopify-activation-20260903

permissions:
  contents: read

jobs:
  commerce-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm run test
        working-directory: server
      - run: npm run mcp:inspect
        working-directory: server
      - run: npm run secret:scan
        working-directory: server
      - run: docker build -t malone-commerce-control:ci server
      - run: npm ci
      - run: npm run build
      - run: npm run verify:v2
